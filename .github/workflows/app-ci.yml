name: Application CI
on:
  push:
    branches: [develop, main]
concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Confirm scheduler is disabled by default
        run: node scripts/run-paper-cycle.mjs
        env:
          PAPER_AUTOMATION_ENABLED: 'false'
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: test-password
      PGHOST: localhost
      PGUSER: trader
      PGDATABASE: trader
    steps:
      - uses: actions/checkout@v4
      - name: Initialize schema and validate initial portfolio
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/init.sql
          psql -v ON_ERROR_STOP=1 -Atc "SELECT value FROM settings WHERE key='initial_cash'" | grep -Fx 500
          psql -v ON_ERROR_STOP=1 -Atc "SELECT value FROM settings WHERE key='account_type'" | grep -Fx CTO
          psql -v ON_ERROR_STOP=1 -Atc "SELECT value FROM settings WHERE key='paper_only'" | grep -Fx true
          psql -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM instruments" | grep -Fx 5
      - name: Verify schema initialization is idempotent
        run: psql -v ON_ERROR_STOP=1 -f sql/init.sql
  docker-paper-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POSTGRES_PASSWORD: integration-only-local-password
      APP_TOKEN: integration-only-local-token-never-used-outside-ci
      TEST_BASE_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Launch PostgreSQL and web application
        run: docker compose up -d --wait
      - name: Wait for HTTP readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:3010/ >/dev/null; then exit 0; fi
            sleep 4
          done
          echo "Web application never became ready" >&2
          exit 1
      - name: Simulate paper buying and selling
        run: node tests/integration-smoke.mjs
      - name: Prepare paper stop gap fixture
        run: node tests/stop-fixture.mjs
      - name: Backdate synthetic paper purchase for completed daily candle
        run: |
          docker compose exec -T db psql -U trader -d trader -v ON_ERROR_STOP=1 -c "UPDATE orders SET created_at = now() - interval '3 days' WHERE id=(SELECT MAX(id) FROM orders WHERE side='BUY')"
      - name: Verify gap-through-stop and duplicate prevention
        run: node tests/stop-execution-e2e.mjs
      - name: Diagnose failure
        if: failure()
        run: docker compose logs --tail=150
      - name: Remove ephemeral test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
  ibkr-mock-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POSTGRES_PASSWORD: mock-db-only-password
      APP_TOKEN: mock-app-only-token
      IBKR_GATEWAY_URL: http://host.docker.internal:5055
      IBKR_CONIDS_JSON: '{"AC.PA":1001,"SPY":1002}'
      TEST_BASE_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated local read-only IBKR mock
        run: |
          node tests/mock-ibkr-gateway.mjs > /tmp/ibkr-mock.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5055/v1/api/iserver/auth/status >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ibkr-mock.log
          exit 1
      - name: Boot app with mock gateway and clean PostgreSQL
        run: docker compose up -d --wait
      - name: Wait for app
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:3010/ >/dev/null; then exit 0; fi
            sleep 4
          done
          docker compose logs --tail=100
          exit 1
      - name: Test IBKR history-to-PostgreSQL pipeline
        run: node tests/mock-ibkr-e2e.mjs
      - name: Diagnostic logs on failure
        if: failure()
        run: |
          cat /tmp/ibkr-mock.log
          docker compose logs --tail=150
      - name: Remove ephemeral test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
