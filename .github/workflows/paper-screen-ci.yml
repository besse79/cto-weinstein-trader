name: Weinstein PAPER safety
on:
  push:
    paths:
      - 'src/paper-candidates.mjs'
      - 'src/paper-risk.mjs'
      - 'tests/paper-candidates.test.js'
      - '.github/workflows/paper-screen-ci.yml'
  pull_request:
    paths:
      - 'src/paper-candidates.mjs'
      - 'src/paper-risk.mjs'
      - 'tests/paper-candidates.test.js'
      - '.github/workflows/paper-screen-ci.yml'
permissions:
  contents: read
jobs:
  paper-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/paper-candidates.test.js tests/paper-risk.test.js
