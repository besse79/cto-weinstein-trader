name: Weinstein MKD contract CI
on:
  push:
    paths:
      - 'src/mkd-*.mjs'
      - 'tests/mkd-*.test.js'
      - '.github/workflows/mkd-contract-ci.yml'
  pull_request:
    paths:
      - 'src/mkd-*.mjs'
      - 'tests/mkd-*.test.js'
      - '.github/workflows/mkd-contract-ci.yml'
permissions:
  contents: read
jobs:
  mkd-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test MKD read-only contract and parity
        run: node --test tests/mkd-readonly.test.js tests/mkd-parity.test.js
