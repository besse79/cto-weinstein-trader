services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      DATABASE_URL: postgres://trader:${POSTGRES_PASSWORD}@db:5432/trader
      APP_TOKEN: ${APP_TOKEN:?set APP_TOKEN}
      CI: ${CI:-false}
      YAHOO_TEST_BASE_URL: ${YAHOO_TEST_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  node_modules:
